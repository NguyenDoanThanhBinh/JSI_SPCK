<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <link rel="stylesheet" href="https://nguyendoanthanhbinh.github.io/JSI_SPCK/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <h2>Đăng nhập</h2>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="Email" required>
        </div>

        <div class="input-group">
            <label>Mật khẩu</label>
            <input type="password" id="login-password" placeholder="Mật khẩu" required>
        </div>

        <button type="button" onclick="loginUser()" class="auth-btn">
            Đăng nhập
        </button>
        <p>Chưa có tài khoản? <a href="signup.html">Đăng kí</a></p>
    </div>

</div>

<!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
<script src="../../js/firebase-config.js"></script>
  <script src="../../js/auth.js"></script>
</body>

</html>
