<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký</title>
  <link rel="stylesheet" href="https://nguyendoanthanhbinh.github.io/JSI_SPCK/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">

    <div class="auth-box">
    <h2>Đăng ký tài khoản</h2>
    <div class="input-group">
        <label>Họ và tên</label>
        <input type="text" id="reg-name" placeholder="Họ và tên" required>
    </div>
    <div class="input-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="Email" required><br><br>
    </div>
    <div class="input-group">
        <label>Mật khẩu</label>
        <input type="password" id="reg-password" placeholder="Mật khẩu" required><br><br>
    </div>
    <button type="button" onclick="registerUser()" class="auth-btn">Đăng ký</button>
     <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </div>
  </div>

 

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
  
  <script src="../../js/firebase-config.js"></script>
  <script src="../../js/auth.js"></script>
</body>
</html>
